<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>摄影作品集</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #080808; --bg-alt: #101010; --bg-card: #151515;
  --fg: #e8e4dd; --fg-dim: #a09b94; --fg-muted: #6b6660;
  --accent: #c9a96e; --accent-dim: rgba(201,169,110,0.14);
  --border: #1e1e1e; --border-lt: #2a2a2a;
  --radius: 4px; --radius-lg: 10px;
  --t: 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
  --section-gap: 140px;
}
html { scroll-behavior: smooth; }
body {
  font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", -apple-system, sans-serif;
  background: var(--bg); color: var(--fg); line-height: 1.7;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
#particleCanvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

.site-header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  background: rgba(8,8,8,0.82); backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px); border-bottom: 1px solid var(--border);
}
.header-inner {
  max-width: 1440px; margin: 0 auto; padding: 0 32px;
  display: flex; align-items: center; justify-content: space-between; height: 64px;
}
.logo { font-size: 19px; font-weight: 600; letter-spacing: 0.05em; }
.logo i { color: var(--accent); font-style: normal; }
.logo-cn { font-size: 15px; font-weight: 400; color: var(--fg-muted); letter-spacing: 0.08em; margin-left: 4px; }
.main-nav { display: flex; gap: 2px; }
.main-nav button {
  background: none; border: none; color: var(--fg-dim); padding: 8px 20px;
  cursor: pointer; font-size: 13.5px; border-radius: var(--radius);
  transition: 0.2s ease; font-family: inherit; letter-spacing: 0.03em;
}
.main-nav button:hover { color: var(--fg); }
.main-nav button.active { color: var(--accent); background: var(--accent-dim); }

.hero { padding: 200px 32px 120px; text-align: center; position: relative; }
.hero::after {
  content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 1px; height: 80px; background: linear-gradient(transparent, var(--accent), transparent);
}
.hero h1 { font-size: 56px; font-weight: 200; letter-spacing: 0.08em; margin-bottom: 20px; }
.hero h1 span { color: var(--accent); font-weight: 300; }
.hero .subtitle { font-size: 16px; color: var(--fg-muted); letter-spacing: 0.1em; max-width: 500px; margin: 0 auto; }
.hero .watermark {
  font-size: 15px; color: var(--accent); letter-spacing: 0.15em; margin-top: 8px;
  opacity: 0.9; user-select: none;
}
.hero .stats { margin-top: 40px; display: flex; justify-content: center; gap: 48px; }
.hero .stat-item { text-align: center; }
.hero .stat-num { font-size: 32px; font-weight: 300; color: var(--accent); }
.hero .stat-label { font-size: 14px; color: var(--fg-muted); letter-spacing: 0.08em; margin-top: 4px; }

.section-block { padding: 0 32px; margin-bottom: var(--section-gap); }
.sec-header { max-width: 700px; margin: 0 auto 56px; text-align: center; }
.sec-label {
  display: inline-block; font-size: 13px; letter-spacing: 0.18em;
  color: var(--accent); border: 1px solid rgba(201,169,110,0.25);
  padding: 6px 20px; border-radius: 20px; margin-bottom: 24px;
}
.sec-divider { width: 40px; height: 3px; background: var(--accent); margin: 0 auto 24px; opacity: 0.5; }
.sec-title { font-size: 32px; font-weight: 300; letter-spacing: 0.05em; margin-bottom: 16px; }
.sec-desc { font-size: 15px; color: var(--fg-dim); line-height: 1.9; max-width: 520px; margin: 0 auto 10px; }
.sec-meta { font-size: 14px; color: var(--fg-muted); letter-spacing: 0.06em; }

.masonry { columns: 4; column-gap: 16px; max-width: 1440px; margin: 0 auto; }
@media (max-width: 1200px) { .masonry { columns: 3; } }
@media (max-width: 768px)  { .masonry { columns: 2; column-gap: 10px; } }
@media (max-width: 480px)  { .masonry { columns: 1; } }

/* ── Mobile responsive ── */
@media (max-width: 768px) {
  .header-inner { flex-wrap: wrap; height: auto; padding: 12px 16px; gap: 8px; }
  .main-nav { flex-wrap: wrap; justify-content: center; gap: 1px; }
  .main-nav button { padding: 6px 12px; font-size: 12px; }
  .hero { padding: 160px 20px 80px; }
  .hero h1 { font-size: 36px; }
  .section-block { padding: 0 16px; }
  .sec-title { font-size: 24px; }
  .site-footer { padding: 40px 16px; }
  .fab { bottom: 24px; right: 24px; width: 44px; height: 44px; font-size: 20px; }
  .fab-trash { bottom: 80px; }
  .audio-ctrl { bottom: 24px; left: 24px; }
  .delete-bar { font-size: 11px; padding: 6px 12px; }
}
@media (max-width: 480px) {
  .header-inner { padding: 10px 12px; gap: 6px; }
  .logo { font-size: 16px; }
  .logo-cn { font-size: 13px; }
  .main-nav button { padding: 5px 8px; font-size: 11px; border-radius: 6px; }
  .hero { padding: 140px 16px 60px; }
  .hero h1 { font-size: 28px; }
  .hero .subtitle { font-size: 14px; }
  .hero .stats { gap: 24px; }
  .hero .stat-num { font-size: 24px; }
  .section-block { padding: 0 10px; margin-bottom: 80px; }
  .sec-header { margin-bottom: 36px; }
  .sec-title { font-size: 20px; }
  .sec-desc { font-size: 13px; }
  .masonry-item { margin-bottom: 10px; }
  .audio-ctrl { bottom: 20px; left: 20px; }
  .fab { bottom: 20px; right: 20px; width: 40px; height: 40px; }
  .fab-trash { bottom: 70px; }
}

.masonry-item {
  break-inside: avoid; margin-bottom: 16px; border-radius: var(--radius-lg);
  overflow: hidden; cursor: pointer; position: relative; background: var(--bg-card);
  opacity: 0; transform: translateY(30px);
  transition: opacity 0.5s ease, transform 0.5s ease, box-shadow 0.35s ease;
}
.masonry-item.visible { opacity: 1; transform: translateY(0); }
.masonry-item .masonry-img { width: 100%; display: block; opacity: 0; transition: opacity 0.45s ease, transform 0.35s ease; }
.masonry-item .masonry-img.loaded { opacity: 1; }
.masonry-item .masonry-img.loaded ~ .masonry-placeholder { display: none; }
.masonry-item .masonry-placeholder {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 13px; color: rgba(255,255,255,0.15); letter-spacing: 0.06em;
}
.masonry-item:hover { transform: translateY(-3px) !important; box-shadow: 0 16px 48px rgba(0,0,0,0.55); }
.masonry-item:hover .masonry-img { transform: scale(1.04); }
.masonry-item .item-overlay {
  position: absolute; inset: 0; background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.5));
  opacity: 0; transition: opacity var(--t);
}
.masonry-item:hover .item-overlay { opacity: 1; }
.masonry-item .item-index {
  position: absolute; bottom: 12px; right: 14px; font-size: 13px;
  color: rgba(255,255,255,0.7); letter-spacing: 0.04em;
}

/* Lightbox */
.lightbox {
  position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.96);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; visibility: hidden; transition: opacity 0.4s ease, visibility 0.4s ease;
}
.lightbox.open { opacity: 1; visibility: visible; }
.lb-main { display: flex; width: 100%; height: 100%; }
.lb-image-area {
  flex: 1; display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden;
}
.lb-image-area img {
  position: absolute; inset: 0;
  width: 100%; height: 100%; object-fit: contain; cursor: grab;
  transform-origin: 50% 50%; user-select: none; -webkit-user-drag: none;
  transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1);
  will-change: transform, opacity;
}
.lb-image-area img.active { opacity: 1; }
.lb-image-area img.inactive { opacity: 0; pointer-events: none; }
.lb-image-area img.grabbing { cursor: grabbing; }

.lb-panel {
  width: 340px; background: rgba(16,16,16,0.95); border-left: 1px solid var(--border);
  overflow-y: auto; padding: 28px 24px; display: flex; flex-direction: column; gap: 32px;
}
@media (max-width: 900px) { .lb-panel { width: 280px; } }
@media (max-width: 640px) {
  .lb-main { flex-direction: column; }
  .lb-panel { width: 100%; max-height: 40vh; border-left: none; border-top: 1px solid var(--border); }
}
.lb-panel h3 {
  font-size: 13px; letter-spacing: 0.12em; color: var(--accent); margin-bottom: 12px; font-weight: 500;
}
.palette-row { display: flex; gap: 20px; margin-bottom: 28px; }
.palette-swatch {
  width: 52px; height: 52px; border-radius: var(--radius); position: relative;
  border: 1px solid var(--border-lt); flex-shrink: 0;
}
.palette-swatch .swatch-hex {
  position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%);
  font-size: 12px; color: var(--fg-muted); white-space: nowrap;
}
.palette-info { font-size: 13px; color: var(--fg-muted); }
.tonal-row { display: flex; gap: 14px; flex-wrap: wrap; }
.tonal-tag {
  font-size: 13px; padding: 4px 10px; border-radius: 3px;
  background: var(--bg-card); color: var(--fg-dim);
}
.tonal-tag.highlight { background: rgba(201,169,110,0.12); color: var(--accent); }
.histo-bar-wrap { display: flex; gap: 1px; align-items: flex-end; height: 48px; margin-top: 8px; }
.histo-bar { flex: 1; background: var(--border-lt); min-width: 2px; border-radius: 1px 1px 0 0; }
.exif-table { width: 100%; border-collapse: collapse; }
.exif-table td { padding: 8px 0; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,0.04); line-height: 1.5; }
.exif-table td:first-child { color: var(--fg-muted); width: 38%; }
.exif-table td:last-child { color: var(--fg-dim); text-align: right; }

.lb-close {
  position: fixed; top: 18px; right: 360px; z-index: 1020;
  background: rgba(255,255,255,0.06); border: none; color: #fff;
  width: 42px; height: 42px; border-radius: 50%; cursor: pointer;
  font-size: 20px; display: flex; align-items: center; justify-content: center;
  transition: background 0.2s ease;
}
.lb-close:hover { background: rgba(255,255,255,0.14); }
@media (max-width: 900px) { .lb-close { right: 296px; } }
@media (max-width: 640px) { .lb-close { right: 16px; top: 12px; } }

.lb-nav-btn {
  position: fixed; top: 50%; transform: translateY(-50%); z-index: 1020;
  background: rgba(255,255,255,0.06); border: none; color: #fff;
  width: 50px; height: 50px; border-radius: 50%; cursor: pointer;
  font-size: 20px; display: flex; align-items: center; justify-content: center;
  transition: background 0.2s ease;
}
.lb-nav-btn:hover { background: rgba(255,255,255,0.14); }
.lb-prev { left: 24px; }
.lb-next { right: 364px; }
@media (max-width: 900px) { .lb-next { right: 300px; } }
@media (max-width: 640px) {
  .lb-nav-btn { width: 36px; height: 36px; font-size: 16px; }
  .lb-prev { left: 10px; } .lb-next { right: 10px; }
}

.lb-bottom {
  position: fixed; bottom: 0; left: 0; right: 340px; z-index: 1020;
  background: rgba(8,8,8,0.8); backdrop-filter: blur(16px);
  border-top: 1px solid var(--border); display: flex; align-items: center;
  justify-content: center; gap: 14px; padding: 10px 20px;
}
@media (max-width: 900px) { .lb-bottom { right: 280px; } }
@media (max-width: 640px) { .lb-bottom { right: 0; } }
.lb-bottom .counter { font-size: 14px; color: var(--fg-dim); letter-spacing: 0.04em; min-width: 70px; text-align: center; }
.lb-bottom .cat-tag { font-size: 13px; color: var(--accent); letter-spacing: 0.08em; }
.lb-zoom-btn {
  background: rgba(255,255,255,0.06); border: none; color: #fff;
  width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
  font-size: 15px; display: flex; align-items: center; justify-content: center;
  transition: background 0.2s ease;
}
.lb-zoom-btn:hover { background: rgba(255,255,255,0.14); }

/* Admin */
.admin-overlay {
  position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,0.7);
  opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease;
}
.admin-overlay.open { opacity: 1; visibility: visible; }
.admin-panel {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 510;
  width: 420px; max-width: 90vw; background: var(--bg-alt);
  border-left: 1px solid var(--border); overflow-y: auto;
  transform: translateX(100%); transition: transform var(--t);
  padding: 28px 24px;
}
.admin-panel.open { transform: translateX(0); }
.admin-panel h3 { font-size: 15px; font-weight: 500; margin-bottom: 24px; letter-spacing: 0.04em; }
.admin-close {
  position: absolute; top: 24px; right: 24px; background: none; border: none;
  color: var(--fg-dim); font-size: 20px; cursor: pointer;
}
.admin-section { margin-bottom: 28px; }
.admin-section h4 { font-size: 13px; letter-spacing: 0.1em; color: var(--fg-muted); margin-bottom: 12px; }
.admin-input {
  width: 100%; padding: 10px 14px; background: var(--bg); border: 1px solid var(--border);
  color: var(--fg); border-radius: var(--radius); font-family: inherit; font-size: 15px;
  margin-bottom: 10px; outline: none; transition: border 0.2s ease;
}
.admin-input:focus { border-color: var(--accent); }
.admin-select {
  width: 100%; padding: 10px 14px; background: var(--bg); border: 1px solid var(--border);
  color: var(--fg); border-radius: var(--radius); font-family: inherit; font-size: 15px;
  margin-bottom: 10px; outline: none; cursor: pointer;
}
.btn {
  padding: 10px 22px; border: none; border-radius: var(--radius); cursor: pointer;
  font-family: inherit; font-size: 15px; letter-spacing: 0.03em; transition: 0.2s ease;
}
.btn-primary { background: var(--accent); color: #000; }
.btn-primary:hover { background: #dbb87c; }
.btn-outline { background: none; border: 1px solid var(--border); color: var(--fg-dim); }
.btn-outline:hover { border-color: var(--fg-muted); color: var(--fg); }
.btn-danger { background: none; border: 1px solid rgba(220,80,80,0.3); color: #dc5050; }
.btn-danger:hover { background: rgba(220,80,80,0.1); }
.btn-sm { padding: 6px 14px; font-size: 14px; }
.file-hint { font-size: 13px; color: var(--fg-muted); margin: 6px 0 10px; }
.admin-img-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.admin-thumb {
  width: 64px; height: 64px; object-fit: cover; border-radius: var(--radius);
  cursor: pointer; border: 2px solid transparent; transition: border 0.2s ease;
}
.admin-thumb:hover { border-color: var(--accent); }
.admin-thumb.selected { border-color: var(--accent); }
.admin-msg { font-size: 14px; margin-top: 8px; }
.admin-msg.ok { color: #6abf6a; }
.admin-msg.err { color: #dc5050; }
.fab {
  position: fixed; bottom: 32px; right: 32px; z-index: 300;
  width: 52px; height: 52px; border-radius: 50%; background: var(--accent);
  color: #000; border: none; cursor: pointer; font-size: 24px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 24px rgba(201,169,110,0.3);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.fab:hover { transform: scale(1.08); box-shadow: 0 6px 32px rgba(201,169,110,0.45); }
.site-footer {
  text-align: center; padding: 60px 24px; border-top: 1px solid var(--border);
  color: var(--fg-muted); font-size: 14px; letter-spacing: 0.05em;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.lb-panel { animation: fadeIn 0.4s ease; }

/* Delete mode */
.delete-bar {
  position: fixed; top: 64px; left: 0; right: 0; z-index: 190;
  background: rgba(200,40,40,0.1); border-bottom: 1px solid rgba(200,40,40,0.25);
  padding: 8px 24px; display: none; align-items: center; justify-content: center;
  gap: 10px; font-size: 14px; color: #e06c6c; letter-spacing: 0.05em;
}
.delete-bar.active { display: flex; }
.masonry-item .del-btn {
  position: absolute; top: 8px; right: 8px; z-index: 10;
  width: 28px; height: 28px; border-radius: 50%; border: none;
  background: rgba(200,40,40,0.85); color: #fff; font-size: 14px;
  cursor: pointer; display: none; align-items: center; justify-content: center;
  transition: transform 0.2s ease, background 0.2s ease; line-height: 1;
}
.masonry-item .del-btn:hover { transform: scale(1.15); background: rgba(220,60,60,0.95); }
.del-mode .masonry-item .del-btn { display: flex; }
.del-mode .masonry-item { cursor: default; }
.del-mode .masonry-item:hover { transform: translateY(0) !important; box-shadow: none; }
.del-mode .masonry-item:hover .masonry-img { transform: scale(1); }
.fab-trash {
  bottom: 96px; background: rgba(255,255,255,0.08); color: var(--fg-dim);
  box-shadow: none; font-size: 18px;
}
.fab-trash:hover { background: rgba(220,60,60,0.25); color: #e06c6c; box-shadow: 0 4px 20px rgba(220,60,60,0.2); }
.fab-trash.del-active { background: rgba(200,40,40,0.75); color: #fff; }

/* Verification modal */
.verify-overlay {
  position: fixed; inset: 0; z-index: 1500; background: rgba(0,0,0,0.75);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease;
}
.verify-overlay.open { opacity: 1; visibility: visible; }
.verify-card {
  background: var(--bg-alt); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 36px 32px 28px;
  width: 360px; max-width: 90vw; text-align: center;
}
.verify-card h3 { font-size: 16px; font-weight: 500; margin-bottom: 8px; letter-spacing: 0.04em; }
.verify-card p { font-size: 14px; color: var(--fg-muted); margin-bottom: 20px; }
.verify-card input {
  width: 100%; padding: 12px 16px; background: var(--bg); border: 1px solid var(--border);
  color: var(--fg); border-radius: var(--radius); font-family: inherit; font-size: 18px;
  text-align: center; letter-spacing: 0.3em; outline: none; margin-bottom: 16px;
  transition: border 0.2s ease;
}
.verify-card input:focus { border-color: var(--accent); }
.verify-card .verify-actions { display: flex; gap: 10px; }
.verify-card .verify-actions button { flex: 1; }
.verify-card .verify-err { font-size: 13px; color: #e06c6c; margin-top: 10px; min-height: 16px; }

/* Audio controls */
.audio-ctrl { position: fixed; bottom: 32px; left: 32px; z-index: 300; display: flex; align-items: center; gap: 10px; }
.audio-toggle {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(201,169,110,0.3);
  background: rgba(8,8,8,0.85); backdrop-filter: blur(12px); color: var(--accent);
  font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.3s ease; line-height: 1;
}
.audio-toggle:hover { border-color: var(--accent); box-shadow: 0 0 16px rgba(201,169,110,0.15); }
.audio-toggle.muted { color: var(--fg-muted); border-color: rgba(255,255,255,0.1); }
.audio-panel {
  display: flex; align-items: center; gap: 8px; opacity: 0; transform: translateX(-8px);
  transition: opacity 0.3s ease, transform 0.3s ease; pointer-events: none;
}
.audio-panel.open { opacity: 1; transform: translateX(0); pointer-events: auto; }
.audio-slider {
  -webkit-appearance: none; width: 80px; height: 3px; border-radius: 2px;
  background: rgba(201,169,110,0.25); outline: none; cursor: pointer;
}
.audio-slider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%;
  background: var(--accent); cursor: pointer;
}
.audio-vol { font-size: 12px; color: var(--accent); letter-spacing: 0.04em; min-width: 30px; }
.audio-prev, .audio-next {
  background: none; border: none; color: var(--fg-dim); cursor: pointer;
  font-size: 13px; padding: 2px 4px; transition: color 0.2s; line-height: 1;
}
.audio-prev:hover, .audio-next:hover { color: var(--accent); }
.audio-track {
  font-size: 12px; color: var(--fg-dim); letter-spacing: 0.03em;
  min-width: 80px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
</style>
</head>
<body>
<canvas id="particleCanvas"></canvas>
<audio id="bgm" src="bgm/Timeline%201.mp3" loop muted autoplay></audio>

<!-- Audio control -->
<div class="audio-ctrl" id="audioCtrl">
  <button class="audio-toggle muted" id="audioToggle" title="点击播放">&#9834;</button>
  <div class="audio-panel" id="audioPanel">
    <button class="audio-prev" id="audioPrev" title="上一首">&#9664;</button>
    <span class="audio-track" id="audioTrack">Timeline</span>
    <button class="audio-next" id="audioNext" title="下一首">&#9654;</button>
    <input type="range" class="audio-slider" id="audioSlider" min="0" max="100" value="25" title="音量">
    <span class="audio-vol" id="audioVol">25%</span>
  </div>
</div>

<header class="site-header">
  <div class="header-inner">
    <div class="logo"><i>&#9670;</i> PhotoFolio <span class="logo-cn">摄影集</span></div>
    <nav class="main-nav" id="categoryNav">
      <button class="active" data-cat="all">全部作品</button>
      <button data-cat="静物摄影">静物摄影</button>

<script src="image_meta.js"></script>
<script>
let IMAGE_META = window.IMAGE_META || {};  // loaded from image_meta.js


const BASE_IMAGE_DATA = {"静物摄影": ["静物/1.png","静物/2.png","静物/3.jpg","静物/4.png","静物/5.JPG","静物/6.JPG","静物/7.JPG","静物/8.jpg","静物/9.jpg","静物/10.jpg","静物/11.jpg","静物/12.jpg","静物/13.jpg","静物/14.jpg","静物/15.jpg","静物/16.jpg","静物/17.png","静物/18.png","静物/19.jpg"],"风光摄影": ["风光/5.png","风光/6.jpg","风光/7.jpg","风光/10.jpg","风光/12.jpg","风光/13.jpg","风光/16.png","风光/17.png","风光/18.png","风光/19.png","风光/20.png","风光/21.png","风光/24.JPG","风光/27.JPG","风光/SDIM0042.JPG","风光/SDIM0078.JPG","风光/SDIM0099.JPG","风光/月亮1.png","人文/4.jpg","人文/7.png","人文/8.png"],"建筑摄影": ["风光/1.png","风光/2.png","风光/4.jpg","风光/22.jpg","风光/23.png","风光/25.jpg","风光/26.jpg","风光/15.png"],"人文纪实": ["人文/1.jpg","人文/2.jpg","人文/3.png","人文/5.png","人文/6.jpg","人文/9.jpg","人文/10.JPG","人文/12.jpg","人文/14.jpg","人文/15.jpg","风光/11.jpg"]};
const CAT_ORDER = ["静物摄影", "风光摄影", "建筑摄影", "人文纪实"];
const CAT_DESC = {"风光摄影": "山川湖海，草木星辰。以自然景观为拍摄对象，展现天地之大美与细节之精微。", "建筑摄影": "塔楼庭院，钢骨玻璃。以建筑及其构件为拍摄对象，呈现结构与空间的形式语言。", "人文纪实": "街头巷尾，民俗百态。记录人的活动与文化印记，在日常中捕捉不日常的瞬间。", "静物摄影": "雕塑装置，器物标本。以人造之物为拍摄对象，在构图中赋予器物以叙事。"};

let imageData = JSON.parse(JSON.stringify(BASE_IMAGE_DATA));
let catOrder = [...CAT_ORDER];
let selectedManage = new Set();
let pendingFiles = [];
let deletedPaths = [];    // persisted in localStorage
let delMode = false;     // delete mode toggle
let pendingDel = null;   // {cat, idx} awaiting verification

function loadDeleted() {
  try {
    const s = localStorage.getItem('photofolio_deleted');
    if (s) deletedPaths = JSON.parse(s);
  } catch(e) { deletedPaths = []; }
  if (!Array.isArray(deletedPaths)) deletedPaths = [];
  // Filter deleted paths out of base image data
  for (const cat of catOrder) {
    const base = BASE_IMAGE_DATA[cat] || [];
    imageData[cat] = base.filter(p => !deletedPaths.includes(p));
  }
}
function saveDeleted() {
  localStorage.setItem('photofolio_deleted', JSON.stringify(deletedPaths));
}
function loadCustom() {
  try {
    const s = localStorage.getItem('photofolio_custom');
    if (s) {
      const d = JSON.parse(s);
      // Only keep custom categories that are NOT already in CAT_ORDER
      if (d.cats && Array.isArray(d.cats)) {
        const validCats = d.cats.filter(c => !CAT_ORDER.includes(c));
        if (validCats.length) catOrder = [...new Set([...CAT_ORDER, ...validCats])];
      }
      // Only load images for categories that exist in current catOrder
      if (d.images && typeof d.images === 'object') {
        for (const [c, u] of Object.entries(d.images)) {
          if (!catOrder.includes(c)) continue;
          if (!imageData[c]) imageData[c] = [];
          if (Array.isArray(u)) imageData[c] = [...imageData[c], ...u];
        }
      }
    }
  } catch(e) {}
}
function saveCustom() {
  const cc = catOrder.filter(c => !CAT_ORDER.includes(c));
  const ci = {};
  for (const c of catOrder) {
    const b = BASE_IMAGE_DATA[c] || [];
    const a = imageData[c] || [];
    if (a.length > b.length) ci[c] = a.slice(b.length);
  }
  localStorage.setItem('photofolio_custom', JSON.stringify({ cats: cc, images: ci }));
}
loadDeleted();
loadCustom();

function renderGallery(filter) {
  const root = document.getElementById('galleryRoot');
  if (delMode) root.classList.add('del-mode'); else root.classList.remove('del-mode');
  let html = '';

  if (filter === 'all') {
    // Render all categories as section blocks with headers
    catOrder.forEach(cat => {
      const imgs = imageData[cat]||[];
      if (!imgs.length) return;
      html += `<div class="section-block" data-cat="${cat}">
        <div class="sec-header"><div class="sec-label">${cat}</div><div class="sec-divider"></div>
        <h2 class="sec-title">${cat} · 掠影</h2>`;
      if (CAT_DESC[cat]) html += `<p class="sec-desc">${CAT_DESC[cat]}</p>`;
      html += `<p class="sec-meta">共 ${imgs.length} 张作品</p></div><div class="masonry">`;
      imgs.forEach((src,i) => {
        let bg = 'var(--bg-card)';
        const parts = src.split('/');
        const folder = parts[0];
        const fileName = parts[1];
        const metaList = IMAGE_META[folder];
        if (metaList) {
          const meta = metaList.find(m => m.file === fileName);
          if (meta && meta.colors && meta.colors.length) bg = meta.colors[0].hex;
        }
        html += `<div class="masonry-item" data-cat="${cat}" data-index="${i}" data-src="${src}" style="background:${bg}"><img class="masonry-img" src="${src}" alt="${cat}" loading="lazy" decoding="async"><div class="masonry-placeholder">${i+1}</div><div class="item-overlay"><span class="item-index">${i+1}</span></div><button class="del-btn" title="删除此图片">&times;</button></div>`;
      });
      html += '</div></div>';
    });
  } else {
    // Category view: section header + description + masonry
    const cats = [filter];
    cats.forEach(cat => {
      const imgs = imageData[cat]||[];
      if (!imgs.length) return;
      html += `<div class="section-block" data-cat="${cat}">
        <div class="sec-header"><div class="sec-label">${cat}</div><div class="sec-divider"></div>
        <h2 class="sec-title">${cat} · 掠影</h2>`;
      if (CAT_DESC[cat]) html += `<p class="sec-desc">${CAT_DESC[cat]}</p>`;
      html += `<p class="sec-meta">共 ${imgs.length} 张作品</p></div><div class="masonry">`;
      imgs.forEach((src,i) => {
        let bg = 'var(--bg-card)';
        const parts = src.split('/');
        const folder = parts[0];
        const fileName = parts[1];
        const metaList = IMAGE_META[folder];
        if (metaList) {
          const meta = metaList.find(m => m.file === fileName);
          if (meta && meta.colors && meta.colors.length) bg = meta.colors[0].hex;
        }
        html += `<div class="masonry-item" data-cat="${cat}" data-index="${i}" data-src="${src}" style="background:${bg}"><img class="masonry-img" src="${src}" alt="${cat}" loading="lazy" decoding="async"><div class="masonry-placeholder">${i+1}</div><div class="item-overlay"><span class="item-index">${i+1}</span></div><button class="del-btn" title="删除此图片">&times;</button></div>`;
      });
      html += '</div></div>';
    });
  }
  root.innerHTML = html;

  // Use native lazy loading + manual visible animation
  root.querySelectorAll('.masonry-img').forEach(img => {
    img.addEventListener('load', () => { img.classList.add('loaded'); }, { once: true });
    if (img.complete) img.classList.add('loaded');
  });
  // IntersectionObserver only for the visible animation (fade-in)
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.style.transitionDelay = (parseInt(entry.target.dataset.index||0) % 8) * 0.06 + 's';
        entry.target.classList.add('visible');
        observer.unobserve(entry.target);
      }
    });
  }, { rootMargin: '200px' });
  root.querySelectorAll('.masonry-item').forEach(item => observer.observe(item));

  let total = 0; catOrder.forEach(c => { total += (imageData[c]||[]).length; });
  document.getElementById('heroStats').innerHTML = `<div class="stat-item"><div class="stat-num">${catOrder.length}</div><div class="stat-label">板块</div></div><div class="stat-item"><div class="stat-num">${total}</div><div class="stat-label">张作品</div></div>`;
}

document.getElementById('galleryRoot').addEventListener('click', e => {
  // Delete button click
  const delBtn = e.target.closest('.del-btn');
  if (delBtn) {
    e.stopPropagation();
    const item = delBtn.closest('.masonry-item');
    pendingDel = { cat: item.dataset.cat, idx: parseInt(item.dataset.index), src: item.dataset.src };
    openVerify('删除图片需要验证身份', null, '确认删除');
    return;
  }
  // Normal click → open lightbox (skip in delete mode)
  if (delMode) return;
  const item = e.target.closest('.masonry-item');
  if (!item) return;
  openLightbox(item.dataset.cat, parseInt(item.dataset.index));
});

document.getElementById('categoryNav').addEventListener('click', e => {
  if (e.target.tagName !== 'BUTTON') return;
  document.querySelectorAll('#categoryNav button').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  renderGallery(e.target.dataset.cat);
});

// ── Lightbox with dual-img crossfade ──
let lbState = { cat:null, index:0, zoom:1, panX:0, panY:0, isDragging:false, dragStartX:0, dragStartY:0, panStartX:0, panStartY:0 };
const lb = document.getElementById('lightbox');
const lbImgWrap = document.getElementById('lbImgWrap');
const imgA = document.querySelector('.lb-img-a');
const imgB = document.querySelector('.lb-img-b');
let activeImg = imgA, standbyImg = imgB;

function getActiveImg() {
  return activeImg.classList.contains('active') ? activeImg : standbyImg;
}

function swapActive() {
  [activeImg, standbyImg] = [standbyImg, activeImg];
  activeImg.classList.add('active');
  activeImg.classList.remove('inactive');
  standbyImg.classList.add('inactive');
  standbyImg.classList.remove('active');
  // Sync zoom state to newly active image
  if (lbState.zoom !== 1 || lbState.panX !== 0 || lbState.panY !== 0) {
    activeImg.style.transform = `translate(${lbState.panX}px,${lbState.panY}px) scale(${lbState.zoom})`;
  }
}

function loadImage(cat, idx) {
  lbState.cat = cat; lbState.index = idx; lbState.zoom = 1; lbState.panX = 0; lbState.panY = 0;
  activeImg.style.transform = 'translate(0px,0px) scale(1)';
  standbyImg.style.transform = 'translate(0px,0px) scale(1)';

  const src = imageData[cat][idx];
  standbyImg.src = src;

  document.getElementById('lbCatTag').textContent = cat;
  document.getElementById('lbCounter').textContent = (idx+1)+' / '+imageData[cat].length;
  document.getElementById('lbPalette').innerHTML = '<span style="font-size: 13px;color:var(--fg-muted);">加载中...</span>';
  document.getElementById('lbPaletteInfo').textContent = '';
  document.getElementById('lbTonal').innerHTML = '<span style="font-size: 13px;color:var(--fg-muted);">加载中...</span>';
  document.getElementById('lbHisto').innerHTML = '';
  document.getElementById('lbExif').innerHTML = '';
  document.getElementById('lbExifStatus').textContent = '';
}

function openLightbox(cat, idx) {
  // First open: show active img immediately, no crossfade
  const src = imageData[cat][idx];
  activeImg.src = src;
  activeImg.classList.add('active');
  activeImg.classList.remove('inactive');
  standbyImg.classList.add('inactive');
  standbyImg.classList.remove('active');
  standbyImg.src = '';

  lbState.cat = cat; lbState.index = idx; lbState.zoom = 1; lbState.panX = 0; lbState.panY = 0;
  activeImg.style.transform = 'translate(0px,0px) scale(1)';
  standbyImg.style.transform = 'translate(0px,0px) scale(1)';

  document.getElementById('lbCatTag').textContent = cat;
  document.getElementById('lbCounter').textContent = (idx+1)+' / '+imageData[cat].length;
  document.getElementById('lbPalette').innerHTML = '<span style="font-size: 13px;color:var(--fg-muted);">加载中...</span>';
  document.getElementById('lbPaletteInfo').textContent = '';
  document.getElementById('lbTonal').innerHTML = '<span style="font-size: 13px;color:var(--fg-muted);">加载中...</span>';
  document.getElementById('lbHisto').innerHTML = '';
  document.getElementById('lbExif').innerHTML = '';
  document.getElementById('lbExifStatus').textContent = '';

  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
  showPanel();
}

function closeLightbox() {
  lb.classList.remove('open');
  document.body.style.overflow = '';
  lbState.zoom = 1; lbState.panX = 0; lbState.panY = 0;
  activeImg.style.transform = 'translate(0px,0px) scale(1)';
  standbyImg.src = '';
}

function nextImg() {
  const len = imageData[lbState.cat].length;
  loadImage(lbState.cat, (lbState.index+1)%len);
}

function prevImg() {
  const len = imageData[lbState.cat].length;
  loadImage(lbState.cat, (lbState.index-1+len)%len);
}

// Zoom: pure center-zoom, pan scales proportionally
function zoomAt(amount) {
  const o = lbState.zoom;
  const nz = Math.max(0.5, Math.min(5, o * amount));
  if (o === nz) return;
  const r = nz / o;
  // Image center = container center + translate. Keep same image point at container center.
  lbState.panX *= r;
  lbState.panY *= r;
  lbState.zoom = nz;
  activeImg.style.transform = `translate(${lbState.panX}px,${lbState.panY}px) scale(${lbState.zoom})`;
}
lbImgWrap.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.deltaY < 0 ? 1.1 : 0.9); }, {passive:false});

[imgA, imgB].forEach(img => {
  img.addEventListener('mousedown', e => {
    if (!img.classList.contains('active')) return;
    e.preventDefault(); lbState.isDragging = true;
    lbState.dragStartX = e.clientX; lbState.dragStartY = e.clientY;
    lbState.panStartX = lbState.panX; lbState.panStartY = lbState.panY;
    img.classList.add('grabbing');
  });
});
window.addEventListener('mousemove', e => {
  if (!lbState.isDragging) return;
  lbState.panX = lbState.panStartX + (e.clientX - lbState.dragStartX);
  lbState.panY = lbState.panStartY + (e.clientY - lbState.dragStartY);
  const cur = imgA.classList.contains('active') ? imgA : imgB;
  cur.style.transform = `translate(${lbState.panX}px,${lbState.panY}px) scale(${lbState.zoom})`;
});
window.addEventListener('mouseup', () => { lbState.isDragging = false; imgA.classList.remove('grabbing'); imgB.classList.remove('grabbing'); });

let lastPinch = 0;
lbImgWrap.addEventListener('touchstart', e => { if (e.touches.length===2) lastPinch = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); }, {passive:true});
lbImgWrap.addEventListener('touchmove', e => {
  if (e.touches.length===2) { e.preventDefault(); const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); if (lastPinch>0) zoomAt(d/lastPinch); lastPinch = d; }
}, {passive:false});
lbImgWrap.addEventListener('touchend', () => { lastPinch = 0; });

document.getElementById('lbClose').addEventListener('click', closeLightbox);
document.getElementById('lbNext').addEventListener('click', nextImg);
document.getElementById('lbPrev').addEventListener('click', prevImg);
document.getElementById('lbZoomIn').addEventListener('click', () => zoomAt(1.25));
document.getElementById('lbZoomOut').addEventListener('click', () => zoomAt(0.8));
document.getElementById('lbZoomReset').addEventListener('click', () => {
  lbState.zoom = 1; lbState.panX = 0; lbState.panY = 0;
  activeImg.style.transform = 'translate(0px,0px) scale(1)';
});
lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });
window.addEventListener('keydown', e => {
  // Verify modal takes priority
  if (verifyOverlay.classList.contains('open')) {
    if (e.key === 'Escape') closeVerify();
    return;
  }
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  else if (e.key === 'ArrowRight') nextImg();
  else if (e.key === 'ArrowLeft') prevImg();
  else if (e.key === '+'||e.key==='=') { e.preventDefault(); zoomAt(1.25); }
  else if (e.key === '-') { e.preventDefault(); zoomAt(0.8); }
  else if (e.key === '0') { lbState.zoom=1;lbState.panX=0;lbState.panY=0;activeImg.style.transform='translate(0px,0px) scale(1)'; }
});

// standby img loads → crossfade + show panel (bind to both imgs)
[imgA, imgB].forEach(img => {
  img.addEventListener('load', () => {
    if (img === standbyImg) { swapActive(); showPanel(); }
  });
});

// ── Image Info Panel (reads from pre-computed IMAGE_META) ──
function findMeta(filePath) {
  const parts = filePath.split('/');
  const folder = parts[0];
  const fileName = parts[1];
  const list = IMAGE_META[folder];
  if (!list) return null;
  return list.find(m => m.file === fileName) || null;
}

function showPanel() {
  const cat = lbState.cat;
  const idx = lbState.index;
  const src = imageData[cat] && imageData[cat][idx];
  const meta = src && findMeta(src);
  if (!meta) { document.getElementById('lbPalette').innerHTML = '<span style="font-size: 13px;color:var(--fg-muted);">无分析数据</span>'; document.getElementById('lbTonal').innerHTML = ''; document.getElementById('lbHisto').innerHTML = ''; document.getElementById('lbExif').innerHTML = ''; document.getElementById('lbExifStatus').textContent = ''; return; }

  // Colors
  if (meta.colors && meta.colors.length) {
    let ch = '<div style="display:flex;gap:18px;">';
    meta.colors.forEach(c => {
      ch += `<div style="text-align:center;"><div style="width:48px;height:48px;border-radius:4px;background:${c.hex};border:1px solid var(--border-lt);margin:0 auto 8px;"></div><span style="font-size: 12px;color:var(--fg-muted);">${c.hex}</span></div>`;
    });
    ch += '</div>';
    document.getElementById('lbPalette').innerHTML = ch;
  }
  document.getElementById('lbPaletteInfo').textContent = '';

  // Tonal
  if (meta.tonal) {
    const t = meta.tonal;
    document.getElementById('lbTonal').innerHTML = `
      <span class="tonal-tag highlight">${t.tonal}</span>
      <span class="tonal-tag">${t.contrast}</span>
      <span class="tonal-tag">平均亮度 ${t.avgLum}</span>`;
    if (t.histBins && t.histBins.length) {
      const maxBin = Math.max(...t.histBins, 1);
      let hh = '';
      t.histBins.forEach(v => {
        hh += `<div class="histo-bar" style="height:${Math.max(1,(v/maxBin)*44)}px;"></div>`;
      });
      document.getElementById('lbHisto').innerHTML = hh;
    }
  }

  // EXIF
  if (meta.exif && meta.exif.length) {
    let eh = '';
    meta.exif.forEach(([l,v]) => { eh += `<tr><td>${l}</td><td>${v}</td></tr>`; });
    document.getElementById('lbExif').innerHTML = eh;
    document.getElementById('lbExifStatus').textContent = '';
  } else {
    document.getElementById('lbExif').innerHTML = '<tr><td colspan="2" style="color:var(--fg-muted);font-size: 13px;">无Exif数据</td></tr>';
    document.getElementById('lbExifStatus').textContent = '';
  }
}

// ── Admin ──
const ao=document.getElementById('adminOverlay'), ap=document.getElementById('adminPanel');
function openAdmin() { if (delMode) toggleDelMode(); ao.classList.add('open'); ap.classList.add('open'); refreshA(); document.body.style.overflow='hidden'; }
function closeAdmin() { ao.classList.remove('open'); ap.classList.remove('open'); document.body.style.overflow=''; pendingFiles=[]; document.getElementById('previewList').innerHTML=''; document.getElementById('btnAddImages').style.display='none'; document.getElementById('fileHint').textContent=''; selectedManage.clear(); }
ao.addEventListener('click',closeAdmin); document.getElementById('adminClose').addEventListener('click',closeAdmin);
document.getElementById('fabAdd').addEventListener('click',openAdmin);
function refreshA() {
  const s1=document.getElementById('targetCategory'), s2=document.getElementById('manageCategory');
  s1.innerHTML=s2.innerHTML=catOrder.map(c=>`<option value="${c}">${c} (${(imageData[c]||[]).length}张)</option>`).join('');
}

document.getElementById('btnAddCat').addEventListener('click',()=>{
  const n=document.getElementById('newCatName').value.trim(), d=document.getElementById('newCatDesc').value.trim(), m=document.getElementById('adminCatMsg');
  if (!n) { m.className='admin-msg err'; m.textContent='请输入名称'; return; }
  if (catOrder.includes(n)) { m.className='admin-msg err'; m.textContent='已存在'; return; }
  openVerify('创建板块「' + n + '」需要验证身份', () => {
    catOrder.push(n); imageData[n]=[]; if (d) CAT_DESC[n]=d; saveCustom();
    m.className='admin-msg ok'; m.textContent='已创建「' + n + '」';
    document.getElementById('newCatName').value=''; document.getElementById('newCatDesc').value='';
    refreshA(); renderGallery(document.querySelector('#categoryNav button.active')?.dataset?.cat||'all');
    const nb=document.createElement('button'); nb.dataset.cat=n; nb.textContent=n; document.getElementById('categoryNav').appendChild(nb);
  }, '确认创建');
});

document.getElementById('btnSelectFiles').addEventListener('click',()=>{ document.getElementById('fileInput').click(); });
document.getElementById('fileInput').addEventListener('change',e=>{
  pendingFiles=Array.from(e.target.files);
  document.getElementById('fileHint').textContent=`已选择 ${pendingFiles.length} 个文件`;
  const pv=document.getElementById('previewList'); pv.innerHTML='';
  pendingFiles.forEach(f=>{ const u=URL.createObjectURL(f); const im=document.createElement('img'); im.src=u; im.className='admin-thumb'; im.title=f.name; pv.appendChild(im); });
  document.getElementById('btnAddImages').style.display=pendingFiles.length>0?'inline-block':'none';
});

document.getElementById('btnAddImages').addEventListener('click',()=>{
  const c=document.getElementById('targetCategory').value, m=document.getElementById('adminImgMsg');
  const files = [...pendingFiles]; // snapshot before async
  if (!files.length) return;
  m.className='admin-msg'; m.textContent='正在处理 ' + files.length + ' 张图片...';
  openVerify('向「' + c + '」添加 ' + files.length + ' 张图片需要验证身份', () => {
    m.textContent = '正在读取文件...';
    const reads = files.map(f => new Promise((resolve, reject) => {
      const rd = new FileReader();
      rd.onload = () => resolve(rd.result);
      rd.onerror = () => reject(new Error('读取失败: ' + f.name));
      rd.readAsDataURL(f);
    }));
    Promise.all(reads).then(urls => {
      if (!imageData[c]) imageData[c] = [];
      imageData[c].push(...urls);
      saveCustom();
      m.className = 'admin-msg ok';
      m.textContent = '已向「' + c + '」添加 ' + urls.length + ' 张';
      pendingFiles = [];
      document.getElementById('previewList').innerHTML = '';
      document.getElementById('btnAddImages').style.display = 'none';
      document.getElementById('fileHint').textContent = '';
      document.getElementById('fileInput').value = '';
      refreshA();
      const activeBtn = document.querySelector('#categoryNav button.active');
      renderGallery(activeBtn ? activeBtn.dataset.cat : 'all');
    }).catch(err => {
      m.className = 'admin-msg err';
      m.textContent = '处理失败: ' + err.message;
    });
  }, '确认添加');
});

document.getElementById('manageCategory').addEventListener('change',()=>{
  const c=document.getElementById('manageCategory').value, lst=document.getElementById('manageImgList');
  const bc=(BASE_IMAGE_DATA[c]||[]).length, all=imageData[c]||[], cu=all.slice(bc);
  selectedManage.clear(); document.getElementById('btnDelSelected').style.display='none';
  if (!cu.length) { lst.innerHTML='<span style="font-size: 13px;color:var(--fg-muted);">无自定义图片</span>'; return; }
  lst.innerHTML=''; cu.forEach((url,i)=>{ const im=document.createElement('img'); im.src=url; im.className='admin-thumb'; im.title=`自定义 ${i+1}`; im.dataset.idx=i; im.addEventListener('click',()=>{ im.classList.toggle('selected'); if (im.classList.contains('selected')) selectedManage.add(i); else selectedManage.delete(i); document.getElementById('btnDelSelected').style.display=selectedManage.size>0?'inline-block':'none'; }); lst.appendChild(im); });
});

document.getElementById('btnDelSelected').addEventListener('click',()=>{
  const c=document.getElementById('manageCategory').value, bc=(BASE_IMAGE_DATA[c]||[]).length, m=document.getElementById('adminDelMsg');
  if (!selectedManage.size) return;
  Array.from(selectedManage).sort((a,b)=>b-a).forEach(i=>imageData[c].splice(bc+i,1));
  saveCustom(); selectedManage.clear(); m.className='admin-msg ok'; m.textContent='已删除';
  document.getElementById('btnDelSelected').style.display='none'; refreshA();
  document.getElementById('manageCategory').dispatchEvent(new Event('change'));
  renderGallery(document.querySelector('#categoryNav button.active')?.dataset?.cat||'all');
});

document.getElementById('btnResetData').addEventListener('click',()=>{
  if (!confirm('确定清除所有自定义数据？原始照片不受影响。')) return;
  localStorage.removeItem('photofolio_custom');
  localStorage.removeItem('photofolio_deleted');
  deletedPaths = [];
  imageData=JSON.parse(JSON.stringify(BASE_IMAGE_DATA)); catOrder=[...CAT_ORDER];
  loadCustom();
  document.querySelectorAll('#categoryNav button').forEach(b=>{ if (!CAT_ORDER.includes(b.dataset.cat)&&b.dataset.cat!=='all') b.remove(); });
  document.querySelectorAll('#categoryNav button').forEach(b=>b.classList.remove('active'));
  document.querySelector('#categoryNav [data-cat="all"]').classList.add('active');
  refreshA(); renderGallery('all'); closeAdmin();
});

window.addEventListener('keydown', e => { if (e.key==='Escape'&&ap.classList.contains('open')&&!lb.classList.contains('open')&&!verifyOverlay.classList.contains('open')) closeAdmin(); });

// ── Delete Mode ──
const fabTrash = document.getElementById('fabTrash');
const deleteBar = document.getElementById('deleteBar');
const verifyOverlay = document.getElementById('verifyOverlay');
const verifyInput = document.getElementById('verifyInput');
const verifyErr = document.getElementById('verifyErr');
const VERIFY_CODE = '062333';
let pendingAction = null;      // callback to execute after verification
let pendingActionLabel = '';   // human-readable label for the action

function toggleDelMode() {
  delMode = !delMode;
  fabTrash.classList.toggle('del-active', delMode);
  deleteBar.classList.toggle('active', delMode);
  const activeBtn = document.querySelector('#categoryNav button.active');
  renderGallery(activeBtn ? activeBtn.dataset.cat : 'all');
}

function openVerify(label, action, btnText) {
  pendingAction = action || null;
  pendingActionLabel = label || '';
  document.getElementById('verifyLabel').textContent = label || '请输入验证码以确认操作';
  document.getElementById('verifyConfirm').textContent = btnText || '确认';
  verifyOverlay.classList.add('open');
  verifyInput.value = '';
  verifyErr.textContent = '';
  setTimeout(() => verifyInput.focus(), 100);
}

function closeVerify() {
  verifyOverlay.classList.remove('open');
  pendingDel = null;
  pendingAction = null;
  pendingActionLabel = '';
}

function executeDelete() {
  if (!pendingDel) return;
  const { cat, src } = pendingDel;
  // Remove from imageData
  imageData[cat] = imageData[cat].filter(p => p !== src);
  // Track in deletedPaths (only for base images)
  if (BASE_IMAGE_DATA[cat] && BASE_IMAGE_DATA[cat].includes(src)) {
    deletedPaths.push(src);
    saveDeleted();
  } else {
    // Custom image deletion — just save via saveCustom
    saveCustom();
  }
  pendingDel = null;
  closeVerify();
  const activeBtn = document.querySelector('#categoryNav button.active');
  renderGallery(activeBtn ? activeBtn.dataset.cat : 'all');
}

fabTrash.addEventListener('click', toggleDelMode);

document.getElementById('verifyCancel').addEventListener('click', closeVerify);
verifyOverlay.addEventListener('click', e => { if (e.target === verifyOverlay) closeVerify(); });

document.getElementById('verifyConfirm').addEventListener('click', () => {
  if (verifyInput.value.trim() !== VERIFY_CODE) {
    verifyErr.textContent = '验证码错误，请重试';
    verifyInput.value = '';
    verifyInput.focus();
    return;
  }
  if (pendingAction) {
    const act = pendingAction;
    closeVerify();
    act();
  } else {
    executeDelete();
  }
});

verifyInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('verifyConfirm').click();
  if (e.key === 'Escape') closeVerify();
});

renderGallery('all');

// ── Particle effect ──
(function() {
  const c = document.getElementById('particleCanvas');
  const ctx = c.getContext('2d');
  const N = 100;
  let w, h, particles = [];
  function resize() { w = c.width = window.innerWidth; h = c.height = window.innerHeight; }
  for (let i = 0; i < N; i++) {
    const baseO = Math.random() * 0.4 + 0.1;
    const phase = Math.random() * Math.PI * 2;
    particles.push({
      x: Math.random(), y: Math.random(),
      vx: (Math.random() - 0.5) * 0.05,
      vy: (Math.random() - 0.5) * 0.05,
      r: Math.random() * 0.9 + 0.3,
      baseO, phase,
      pulseSpeed: 0.4 + Math.random() * 0.8
    });
  }
  resize(); window.addEventListener('resize', resize);
  let t = 0;
  function draw(ts) {
    const dt = Math.min((ts - t) / 1000, 0.1); t = ts;
    ctx.clearRect(0, 0, w, h);
    for (const p of particles) {
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.x < 0) p.x = 1; if (p.x > 1) p.x = 0;
      if (p.y < 0) p.y = 1; if (p.y > 1) p.y = 0;
      const o = p.baseO + Math.sin(ts * 0.001 * p.pulseSpeed + p.phase) * 0.25;
      ctx.beginPath();
      ctx.arc(p.x * w, p.y * h, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(201,169,110,${Math.max(0.03, o)})`;
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();

// ── Background music ──
(function() {
  const bgm = document.getElementById('bgm');
  const toggle = document.getElementById('audioToggle');
  const panel = document.getElementById('audioPanel');
  const ctrl = document.getElementById('audioCtrl');
  const slider = document.getElementById('audioSlider');
  const vol = document.getElementById('audioVol');
  const trackEl = document.getElementById('audioTrack');
  const prevBtn = document.getElementById('audioPrev');
  const nextBtn = document.getElementById('audioNext');

  const tracks = [
    { name: 'Timeline', file: 'bgm/Timeline%201.mp3' },
    { name: 'Ragtime', file: 'bgm/Ragtime_Receiver.mp3' },
    { name: 'Saxophone', file: 'bgm/bgm.mp3' }
  ];
  let idx = 0, playing = false;

  function switchTrack(dir) {
    const wasPlaying = playing && !bgm.paused;
    idx = (idx + dir + tracks.length) % tracks.length;
    bgm.src = tracks[idx].file;
    trackEl.textContent = tracks[idx].name;
    bgm.load();
    bgm.volume = slider.value / 100;
    bgm.muted = wasPlaying ? false : bgm.muted;
    if (wasPlaying) bgm.play().catch(() => {});
  }

  bgm.volume = slider.value / 100;
  trackEl.textContent = tracks[0].name;

  prevBtn.addEventListener('click', (e) => { e.stopPropagation(); switchTrack(-1); });
  nextBtn.addEventListener('click', (e) => { e.stopPropagation(); switchTrack(1); });

  toggle.addEventListener('click', () => {
    if (bgm.muted) { bgm.muted = false; bgm.play().catch(() => {}); return; }
    if (playing && !bgm.paused) { bgm.pause(); }
    else { bgm.play().catch(() => {}); }
  });

  slider.addEventListener('input', () => { bgm.volume = slider.value / 100; vol.textContent = slider.value + '%'; });
  toggle.addEventListener('mouseenter', () => panel.classList.add('open'));
  ctrl.addEventListener('mouseleave', () => panel.classList.remove('open'));

  function unmute() {
    if (bgm.muted) { bgm.muted = false; bgm.play().catch(() => {}); }
    if (!bgm.muted && !bgm.paused) { playing = true; toggle.textContent = '♪'; toggle.classList.remove('muted'); }
  }
  ['click','scroll','touchstart','keydown'].forEach(e => document.addEventListener(e, unmute));

  bgm.addEventListener('play',  () => { if (!bgm.muted) { playing = true; toggle.textContent = '♪'; toggle.classList.remove('muted'); } });
  bgm.addEventListener('pause', () => { playing = false; toggle.textContent = '♫'; toggle.classList.add('muted'); });
})();
</script>
